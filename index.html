<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="style.css">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #050508;
  color: #e6e6e6;
  font-family: serif;
}

#space {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.cluster {
  position: absolute;
  padding: 10px 14px;
  border-radius: 6px;
  line-height: 1.35;
  user-select: none;
  cursor: grab;
  mix-blend-mode: screen;
  pointer-events: auto;
  transition: filter 0.4s ease, opacity 0.4s ease;
}

.cluster.glitch {
  font-family: monospace;
  letter-spacing: 0.05em;
  filter: contrast(1.4);
}

/* bouton autorisation iOS */
#motionBtn {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 10px 16px;
  background: rgba(255,255,255,0.08);
  color: #eee;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  font-size: 14px;
  display: none;
}
</style>
</head>

<body>
<canvas id="space"></canvas>
<button id="motionBtn">Activer le mouvement</button>

<script src="clusters.js"></script>

</body>
</html>
